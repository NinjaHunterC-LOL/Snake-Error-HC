<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="wrapper">
        <div class="game-details">
            <span class="score">Score: 0</span>
            <span class="highscore">High Score: 0</span>
        </div>
        <div class="play-board"></div>
    </div>

    <!-- Game Over Modal -->
    <div class="game-over-modal" id="gameOverModal">
        <div class="game-over-content">
            <h2>Game Over!</h2>
            <p>Your Score: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">Replay</button>
        </div>
    </div>

    <!-- Difficulty Selection Modal -->
    <div class="difficulty-modal" id="difficultyModal">
        <div class="difficulty-content">
            <h2>Select Difficulty</h2>
            <button onclick="startGame('easy')">Easy</button>
            <button onclick="startGame('medium')">Medium</button>
            <button onclick="startGame('hard')">Hard</button>
            <button onclick="startGame('hard')">Cooked?</button>
        </div>
    </div>

<button id="tutorialButton">How to Play</button>

<div id="tutorialModal" class="tutorial-modal">
    <div class="tutorial-content">
        <h2>How to Play</h2>

        <p>🐍 Use the arrow keys to move the snake.</p>
        <p>🟡 Eat the food to increase your score.</p>
        <p>🚧 Don't hit the walls.</p>
        <p>💥 Don't hit your own body.</p>

        <button id="closeTutorial">Got It!</button>
    </div>
</div>
</body>
</html>
